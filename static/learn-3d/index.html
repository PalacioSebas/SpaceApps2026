<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Explorá una enana marrón, una estrella joven con disco y una gigante roja pulsante en 3D. Un recorrido educativo de Papastronomy, con ilustraciones genéricas y fuentes NASA.">
  <title>Aprendé en 3D · Papastronomy</title>
  <link rel="stylesheet" href="./page.css">
  <script src="./i18n.js" defer></script>
  <script src="./content.js" defer></script>
  <script src="./viewer.js" defer></script>
  <script src="./page.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6.5" fill="#0a1020" stroke="#f3f5fa" stroke-width="1.4"/>
        <path d="M11 12.5a6.5 6.5 0 0 1 9.5-1.8" stroke="#55d6ff" stroke-width="1.4" stroke-linecap="round"/>
        <ellipse cx="16" cy="16" rx="14" ry="5.2" transform="rotate(-24 16 16)" stroke="#9b8cff" stroke-opacity=".8"/>
        <circle cx="28.2" cy="10.6" r="1.6" fill="#55d6ff"/>
      </svg>
      <span>Papastronomy</span><span class="module-name" data-page-i18n="moduleName">Atlas interactivo</span>
    </div>
    <div class="header-actions">
      <a id="return-link" href="../../#explorador" data-page-i18n="returnLink" hidden>← Ver observaciones</a>
      <div class="language-switch" id="language-switch" role="group" aria-label="Idioma del visor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
        <button type="button" data-language="es" lang="es" aria-pressed="true">Español</button>
        <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>
  <main>
    <papastronomy-object-viewer explanation="simple"></papastronomy-object-viewer>
    <noscript>Activá JavaScript para explorar el objeto. Una enana marrón es un objeto subestelar que puede estudiarse en infrarrojo.</noscript>
  </main>
  <footer>
    <span class="footer-label" data-page-i18n="footerLabel">PAPASTRONOMY / APRENDÉ EN 3D</span>
    <p data-page-i18n="footerText">Una forma de entender los objetos del explorador. Las conclusiones científicas requieren observaciones.</p>
    <p id="return-hint" data-page-i18n="returnHint" hidden>Tu exploración sigue abierta en la pestaña anterior. Podés volver a ella conservando el campo y la selección.</p>
  </footer>
</body>
</html>
