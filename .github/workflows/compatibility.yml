name: Windows and Linux compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: JavaScript syntax and regression checks
        shell: bash
        run: |
          node --check static/app.js
          node --check static/demo-profiles.js
          node --check static/demo-assistant.js
          node scripts/check_frontend.cjs
          node scripts/check_images.cjs
          node scripts/check_profiles.cjs
          node scripts/check_assistant.cjs
          node --check static/learn-3d/viewer.js
          node --check static/learn-3d/page.js
          node static/learn-3d/check.cjs

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Linux launcher and regression tests
        if: runner.os == 'Linux'
        env:
          PAPASTRONOMY_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash run_project.sh --test
      - name: Windows launcher and regression tests
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PAPASTRONOMY_PYTHON: ${{ steps.python.outputs.python-path }}
        run: run_project.bat --test
